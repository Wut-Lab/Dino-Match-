<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7fd0ff">
  <meta name="description" content="Dino-Match: a bubbly dinosaur matching game for little kids.">
  <title>Dino-Match</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">

    <!-- Main menu -->
    <section id="screen-menu" class="screen active" aria-label="Main menu">
      <div class="scene" id="menu-scene"></div>
      <div class="menu-center">
        <h1 class="logo" id="logo" aria-label="Dino-Match">Dino-Match</h1>
        <button id="btn-play" class="btn btn-play">Play!</button>
        <div class="badge" id="games-badge">
          <span class="badge-icon" aria-hidden="true">🏆</span>
          <span>Games won</span>
          <strong id="games-count">0</strong>
        </div>
      </div>
      <div class="parade" id="parade" aria-hidden="true"></div>
    </section>

    <!-- Gameplay -->
    <section id="screen-game" class="screen" aria-label="Game">
      <header class="game-bar">
        <button id="btn-home" class="icon-btn" aria-label="Back to menu">🏠</button>
        <div id="progress" class="progress" role="status"></div>
      </header>
      <div class="game-main">
        <aside class="target-panel">
          <div class="target-card" id="target-card">
            <div class="target-label" id="target-label">Find me!</div>
            <div class="target-pic" id="target-pic"></div>
            <div class="target-name" id="target-name">&nbsp;</div>
          </div>
        </aside>
        <div class="field" id="field">
          <div class="scene" id="field-scene"></div>
        </div>
      </div>

      <div id="win" class="overlay hidden" role="dialog" aria-label="You won!">
        <div class="confetti" id="confetti"></div>
        <div class="win-card">
          <div class="win-trophy" aria-hidden="true">🏆</div>
          <h2>Hooray!</h2>
          <p>You found all the dinos!</p>
          <div class="badge"><span>Games won</span> <strong id="win-count">0</strong></div>
          <div class="win-buttons">
            <button id="btn-again" class="btn btn-play">Play again</button>
            <button id="btn-menu" class="btn btn-small">Menu</button>
          </div>
        </div>
      </div>
    </section>

    <button id="btn-sound" class="icon-btn sound-btn" aria-label="Sound on" aria-pressed="true">🔊</button>
  </div>

  <script src="js/dinos.js"></script>
  <script src="js/scenes.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
